name: Tukkiiie focus plugin checks

on:
  push:
    branches:
      - tukkiiie-dev
    paths:
      - "plugins/pomodoro/**"
      - "crates/bongocat-plugin-sdk/**"
      - "crates/bongocat-plugin-manager/**"
      - "crates/bongocat-plugin-service/**"
      - "crates/bongocat-app/**"
      - "crates/bongocat-runtime/**"
      - "crates/bongocat-live2d-playback/**"
      - "resources/models/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/tukkiie-focus-check.yml"
  pull_request:
    branches:
      - tukkiiie-dev
    paths:
      - "plugins/pomodoro/**"
      - "crates/bongocat-plugin-sdk/**"
      - "crates/bongocat-runtime/**"
      - "crates/bongocat-live2d-playback/**"
      - "resources/models/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/tukkiie-focus-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tukkiiie-focus-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format and test Tukkiiie study features
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libasound2-dev

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Format Rust code
        run: cargo fmt --all

      - name: Test plugin, runtime and study motion
        run: cargo test -p bongocat-plugin-sdk -p bongocat-pomodoro -p bongocat-live2d-playback
