name: Tukkiiie Windows development build

on:
  push:
    branches:
      - tukkiiie-dev
    paths:
      - "crates/**"
      - "plugins/**"
      - "resources/**"
      - "shared/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "rust-toolchain.toml"
      - ".github/workflows/tukkiiie-windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tukkiiie-windows-development-build
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Build Windows x64 installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Install Just
        uses: taiki-e/install-action@just

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64-development

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Prepare Windows Authenticode signing (optional for development)
        shell: pwsh
        env:
          BONGOCAT_WINDOWS_SIGNING_THUMBPRINT: ${{ secrets.BONGOCAT_WINDOWS_SIGNING_THUMBPRINT }}
          BONGOCAT_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.BONGOCAT_WINDOWS_SIGNING_PFX_BASE64 }}
          BONGOCAT_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.BONGOCAT_WINDOWS_SIGNING_PFX_PASSWORD }}
          BONGOCAT_WINDOWS_SIGNTOOL: ${{ vars.BONGOCAT_WINDOWS_SIGNTOOL }}
          BONGOCAT_WINDOWS_TIMESTAMP_URL: ${{ vars.BONGOCAT_WINDOWS_TIMESTAMP_URL }}
        run: .\\tools\\prepare-windows-signing.ps1

      - name: Build Windows plugin packages
        run: cargo run --locked -p bongocat-plugin-packaging -- catalog dev --root . --target x86_64-pc-windows-msvc --output target/plugin-dev/plugins

      - name: Upload Windows plugin packages
        uses: actions/upload-artifact@v4
        with:
          name: tukkiiie-windows-x64-plugins
          path: target/plugin-dev/plugins
          if-no-files-found: error
          retention-days: 7

      - name: Build development installer
        run: just build --environment development --formats nsis

      - name: Test plugin HUD service
        run: cargo test --locked -p bongocat-plugin-service

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "target/package" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one installer, found $($installers.Count)"
          }
          if ($installers[0].Length -le 0) {
            throw "Installer is empty"
          }
          Write-Host "Built $($installers[0].Name) ($($installers[0].Length) bytes)"
          if (-not [string]::IsNullOrWhiteSpace($env:BONGOCAT_WINDOWS_SIGNING_THUMBPRINT)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
            if ($signature.Status -ne "Valid") {
              throw "Expected a valid Authenticode signature; found $($signature.Status)"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $env:BONGOCAT_WINDOWS_SIGNING_THUMBPRINT) {
              throw "Installer was signed by an unexpected certificate"
            }
            Write-Host "Verified Authenticode signature: $($signature.SignerCertificate.Subject)"
          }
          else {
            Write-Warning "Installer is unsigned. Smart App Control may block this development artifact."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: tukkiiie-windows-x64-development
          path: target/package/*.exe
          if-no-files-found: error
          retention-days: 7 
